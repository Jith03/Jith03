<svg fill="none" viewBox="0 0 900 220" width="100%" height="220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0b1a2e" />
      <stop offset="100%" stop-color="#050a14" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B4D8" />
      <stop offset="50%" stop-color="#90E0EF" />
      <stop offset="100%" stop-color="#0077B6" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="circuit-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00B4D8" stroke-width="0.5" stroke-opacity="0.08" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="900" height="220" rx="16" fill="url(#bg-grad)" stroke="#00B4D8" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Grid Layer -->
  <rect width="900" height="220" rx="16" fill="url(#circuit-grid)" />

  <!-- Circuit Traces & Glow Nodes -->
  <g opacity="0.35">
    <path d="M 50 20 L 150 20 L 190 60 L 320 60" stroke="#00B4D8" stroke-width="1.5" fill="none" />
    <circle cx="50" cy="20" r="3.5" fill="#00B4D8" filter="url(#glow)" />
    <circle cx="320" cy="60" r="3" fill="#90E0EF" />

    <path d="M 850 200 L 750 200 L 710 160 L 580 160" stroke="#00B4D8" stroke-width="1.5" fill="none" />
    <circle cx="850" cy="200" r="3.5" fill="#00B4D8" filter="url(#glow)" />
    <circle cx="580" cy="160" r="3" fill="#90E0EF" />

    <path d="M 820 40 L 780 80 L 680 80" stroke="#0077B6" stroke-width="1.2" fill="none" />
    <circle cx="820" cy="40" r="3" fill="#00B4D8" />
    
    <path d="M 80 180 L 120 140 L 220 140" stroke="#0077B6" stroke-width="1.2" fill="none" />
    <circle cx="80" cy="180" r="3" fill="#00B4D8" />
  </g>

  <!-- Title Text -->
  <text x="50%" y="78" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">
    Hi there, I'm <tspan fill="url(#cyan-glow)" filter="url(#glow)">Nayanajith Ranasinghe</tspan> 👋
  </text>

  <!-- Subtitle Text -->
  <text x="50%" y="118" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="500" fill="#90E0EF" letter-spacing="1">
    ELECTRONIC &amp; TELECOMMUNICATION ENGINEERING
  </text>
  
  <text x="50%" y="142" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#78909C" letter-spacing="0.5">
    University of Moratuwa • Digital IC &amp; FPGA Acceleration • Embedded IoT • ML
  </text>

  <!-- Floating Tech Pill Badges -->
  <g transform="translate(230, 168)">
    <rect x="0" y="0" width="100" height="26" rx="13" fill="#00B4D8" fill-opacity="0.12" stroke="#00B4D8" stroke-width="1" stroke-opacity="0.5" />
    <text x="50" y="17" text-anchor="middle" font-family="monospace" font-size="11" fill="#90E0EF">⚡ FPGA/ASIC</text>

    <rect x="110" y="0" width="110" height="26" rx="13" fill="#00B4D8" fill-opacity="0.12" stroke="#00B4D8" stroke-width="1" stroke-opacity="0.5" />
    <text x="165" y="17" text-anchor="middle" font-family="monospace" font-size="11" fill="#90E0EF">🧠 CNN / RISC-V</text>

    <rect x="230" y="0" width="100" height="26" rx="13" fill="#00B4D8" fill-opacity="0.12" stroke="#00B4D8" stroke-width="1" stroke-opacity="0.5" />
    <text x="280" y="17" text-anchor="middle" font-family="monospace" font-size="11" fill="#90E0EF">🌐 Smart IoT</text>

    <rect x="340" y="0" width="95" height="26" rx="13" fill="#00B4D8" fill-opacity="0.12" stroke="#00B4D8" stroke-width="1" stroke-opacity="0.5" />
    <text x="387" y="17" text-anchor="middle" font-family="monospace" font-size="11" fill="#90E0EF">📊 Math &amp; ML</text>
  </g>
</svg>
